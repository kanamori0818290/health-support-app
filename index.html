            q4b: [['mgr_q4b_1', 'Q4B-1. 立ち作業や歩行を減らす配慮は可能ですか', ['可能', '一部可能', '困難', '該当なし']], ['mgr_q4b_2', 'Q4B-2. 重量物、無理な姿勢、階段昇降などを制限できますか', ['可能', '一部可能', '困難', '該当なし']], ['mgr_q4b_3', 'Q4B-3. 機械操作、工具使用、車両運転などを一時的に制限できますか', ['可能', '一部可能', '困難', '該当なし']], ['mgr_q4b_4', 'Q4B-4. 復職直後に単独作業を避け、周囲が確認できる体制を取れますか', ['可能', '一部可能', '困難', '該当なし']], ['mgr_q4b_5', 'Q4B-5. 本人の状態に合わせて作業内容を変更できますか', ['可能', '一部可能', '困難', '判断できない']]],

            q5: [['mgr_q5_1', 'Q5-1. 復職後、本人に定期的に声かけ・確認を行えますか', ['行える', '一部行える', '難しい', '未定']], ['mgr_q5_2', 'Q5-2. 本人が相談しやすい職場体制がありますか', ['ある', '一部ある', '不十分', '判断できない']], ['mgr_q5_3', 'Q5-3. 体調不良があった場合、早めに保健師・人事へ相談できますか', ['できる', 'おおむねできる', '難しい', '判断できない']], ['mgr_q5_4', 'Q5-4. 本人の復職について、職場として懸念していることはありますか', ['ない', 'ある', '判断できない', '無回答']], ['mgr_q5_5', 'Q5-5. 復職前に保健師または産業医へ相談したいですか', ['不要', '保健師へ相談したい', '産業医へ相談したい', '判断できない']]]
        };

        // -----------------------------------------------------------
        // 3. メインアプリケーション
        // -----------------------------------------------------------
        function App() {
            // -- 認証・ログイン用のState --
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [currentRole, setCurrentRole] = React.useState(null);
            const [authStep, setAuthStep] = React.useState('email_password'); // 'email_password' | 'verify_signin' | 'enroll_phone'
            const [authData, setAuthData] = React.useState({ email: '', password: '' });
            const [verificationCode, setVerificationCode] = React.useState('');
            const [authErrorMsg, setAuthErrorMsg] = React.useState('');
            
            // -- アプリケーションState --
            const [cases, setCases] = React.useState(mockCases);
            const [selectedUser, setSelectedUser] = React.useState(null);
            const [actualPhase, setActualPhase] = React.useState(0);
            const [currentPhase, setCurrentPhase] = React.useState(0);
            const [pgStep, setPgStep] = React.useState(1);
            const [formData, setFormData] = React.useState({});
            const [contacts, setContacts] = React.useState([]);
            const [newContactMsg, setNewContactMsg] = React.useState("");
            const [showInterviewForm, setShowInterviewForm] = React.useState(null);
            const [interviewDates, setInterviewDates] = React.useState({ date1: '', date2: '', date3: '' });
            const [dialog, setDialog] = React.useState(null);

            // -- Helper Functions --
            const showAlert = (message) => setDialog({ type: 'alert', message });
            const showConfirm = (message, action) => setDialog({ type: 'confirm', message, onConfirm: () => { action(); setDialog(null); } });

            // -- ログイン処理 (Mock) --
            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setAuthErrorMsg('');
                if (authData.email && authData.password) {
                    // 簡単なモック認証（実際のFirebaseは使わない）
                    if (authData.email.includes("admin")) {
                        setCurrentRole('admin');
                    } else if (authData.email.includes("mgr")) {
                        setCurrentRole('manager');
                    } else if (authData.email.includes("ohp")) {
                        setCurrentRole('ohp');
                    } else {
                        setCurrentRole('employee');
                    }
                    // MFAステップへ進む
                    setAuthStep('verify_signin');
                } else {
                    setAuthErrorMsg("メールアドレスとパスワードを入力してください。");
                }
            };

            const handleMfaVerify = (e) => {
                e.preventDefault();
                setAuthErrorMsg('');
                if (verificationCode === '123456') {
                    // ログイン成功！
                    setIsLoggedIn(true);
                    if (currentRole === 'employee') {
                        handleSelectUser(cases[0]);
                    }
                } else {
                    setAuthErrorMsg("認証コードが正しくありません。（テスト用コード: 123456）");
                }
            };

            const handleDemoLogin = (role) => {
                setCurrentRole(role);
                setIsLoggedIn(true);
                if (role === 'employee') {
                    handleSelectUser(cases[0]);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentRole(null);
                setSelectedUser(null);
                setAuthStep('email_password');
                setAuthData({ email: '', password: '' });
                setVerificationCode('');
            };

            // -- データ操作 --
            const handleSelectUser = (user) => {
                setSelectedUser(user);
                setActualPhase(user.phase || 0);
                setCurrentPhase(user.phase || 0);
                setPgStep(user.pgStep || 1);
                setFormData(user.formData || { ...user });
                setContacts(user.contacts || [
                    { date: '2026-09-01 10:00', author: 'システム', text: '休業申請が登録されました。' }
                ]);
            };

            const saveData = (updates = {}) => {
                const newData = { ...formData, ...updates };
                setFormData(newData);
                
                let newActualPhase = actualPhase;
                let newPgStep = pgStep;
                
                if (updates.phase !== undefined) {
                    newActualPhase = updates.phase;
                    setActualPhase(newActualPhase);
                    setCurrentPhase(newActualPhase);
                }
                if (updates.pg_step !== undefined) {
                    newPgStep = updates.pg_step;
                    setPgStep(newPgStep);
                }

                setCases(cases.map(c => c.id === selectedUser.id ? { 
                    ...c, 
                    phase: newActualPhase, 
                    pgStep: newPgStep,
                    formData: newData,
                    contacts: contacts,
                    lastUpdated: Date.now()
                } : c));

                if (updates.phase !== undefined) {
                    if (updates.phase < actualPhase) showAlert(`Phase ${updates.phase} に差し戻しました。`);
                    else showAlert("データを保存し、次のステップへ進みました。");
                } else if (updates.pg_step !== undefined) {
                    if (updates.pg_step < pgStep) showAlert(`Step ${updates.pg_step} に差し戻しました。`);
                } else {
                    showAlert("入力内容を修正・上書き保存しました。");
                }
            };

            const addContactLog = (text) => {
                if (!text.trim()) return;
                const now = new Date();
                const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const newLogs = [{ date: timeStr, author: currentRole === 'employee' ? '本人' : currentRole === 'manager' ? '職制' : currentRole === 'ohp' ? '専門職' : '管理者', text }, ...contacts];
                setContacts(newLogs);
                setNewContactMsg("");
                if (selectedUser) {
                    setCases(cases.map(c => c.id === selectedUser.id ? { ...c, contacts: newLogs } : c));
                }
            };

            const downloadCSV = () => {
                const headers = ["項目", "内容"];
                const rows = Object.entries(formData).map(([key, value]) => {
                    const safeValue = String(value || '').replace(/"/g, '""').replace(/\n/g, ' ');
                    return `"${key}","${safeValue}"`;
                });
                const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `data_${selectedUser.id}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const sendInterviewRequest = (type) => {
                if (!interviewDates.date1) {
                    showAlert("第1希望日時は入力必須です。");
                    return;
                }
                const routeName = type === 'B' ? '保健師面談' : '産業医・5者面談';
                const msg = `【システム通知】${routeName}の調整が開始されました。\n第1希望: ${interviewDates.date1}\n第2希望: ${interviewDates.date2}\n第3希望: ${interviewDates.date3}`;
                
                addContactLog(msg);
                saveData({ interview_requested: true });
                setShowInterviewForm(null);
                showAlert(`${routeName}の希望日を通知しました。面談実施後、判定を確定させてください。`);
            };

            // -- ロジック計算 --
            const calculateRiskScore = () => {
                let totalScore = 0; let scoreReasons = [];
                if (formData.emp_q0_2 === '2') { totalScore += 5; scoreReasons.push({ item: "主治医からの就業制限あり", points: 5, source: "本人回答" }); }
                if (formData.emp_q5_1 === '4') { totalScore += 5; scoreReasons.push({ item: "本人に復職への強い不安あり", points: 5, source: "本人回答" }); }
                if (formData.mgr_q2_1 === '3') { totalScore += 15; scoreReasons.push({ item: "業務に安全上の重大な懸念あり", points: 15, source: "職制評価" }); }
                if (formData.mgr_q5_4 === '2') { totalScore += 10; scoreReasons.push({ item: "職場として受入れに強い懸念", points: 10, source: "職制評価" }); }
                if (formData.mgr_q5_5 === '2') { totalScore += 3; scoreReasons.push({ item: "職制が保健師相談を希望", points: 3, source: "職制評価" }); }
                if (formData.mgr_q5_5 === '3') { totalScore += 5; scoreReasons.push({ item: "職制が産業医相談を希望", points: 5, source: "職制評価" }); }
                let autoJudge = "Level 0 (通常復帰)"; let level = 0;
                if (totalScore >= 15) { autoJudge = "Level 3 (5者打合せ必須)"; level = 3; }
                else if (totalScore >= 10) { autoJudge = "Level 2 (産業医面談推奨)"; level = 2; }
                else if (totalScore >= 3) { autoJudge = "Level 1 (保健師確認推奨)"; level = 1; }
                return { score: totalScore, level, judge: autoJudge, reasons: scoreReasons };
            };

            const hasEvalGap = () => {
                if (actualPhase !== 4) return false;
                for (let i=1; i<=3; i++) {
                    const emp = formData[`follow_emp_q${i}`];
                    const mgr = formData[`follow_mgr_q${i}`];
                    if (emp && mgr && Math.abs(parseInt(emp) - parseInt(mgr)) >= 1) return true;
                }
                return false;
            };
            const isDiscrepancy = hasEvalGap();

            const getIdleDays = (lastUpdated) => { 
                if (!lastUpdated) return 0; 
                return Math.floor((Date.now() - lastUpdated) / (1000 * 60 * 60 * 24)); 
            };

            // -- 権限・ロック解除 --
            const isAdmin = currentRole === 'admin';
            const canEdit = (role) => isAdmin || currentRole === role;
            
            const canEdit0 = isAdmin || currentRole === 'employee';
            const canEdit1 = isAdmin || currentRole === 'manager';
            const canEdit2 = isAdmin || currentRole === 'ohp';
            const canEditEmp4 = isAdmin || currentRole === 'employee';
            const canEditMgr4 = isAdmin || currentRole === 'manager';

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData({ ...formData, [name]: type === 'checkbox' ? checked : value });
            };

            // -- UIレンダラー --
            const renderQ = (id, label, options = [], disabled = false) => (
                <div key={id} className="mb-4 bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                    <label className="block text-sm font-bold text-slate-700 mb-3">{label}</label>
                    <div className="flex flex-wrap gap-3">
                        {options.map((opt, i) => {
                            const val = String(i+1);
                            const isChecked = formData[id] === val;
                            return (
                                <label key={val} className={`flex items-center gap-2 p-2 border rounded-md cursor-pointer transition-colors ${disabled && isChecked ? 'bg-blue-50 border-blue-300' : disabled ? 'bg-slate-50 opacity-50' : 'hover:bg-slate-50'}`}>
                                    <input type="radio" name={id} value={val} checked={isChecked} onChange={handleInputChange} disabled={disabled} className="w-4 h-4 text-blue-600"/>
                                    <span className={`text-sm ${disabled && isChecked ? 'font-bold text-blue-800' : ''}`}>{opt}</span>
                                </label>
                            );
                        })}
                    </div>
                </div>
            );

            const renderText = (id, placeholder, disabled) => (
                <textarea name={id} value={formData[id] || ''} onChange={handleInputChange} disabled={disabled} placeholder={placeholder} className={`w-full p-3 border rounded-md h-24 text-sm outline-none focus:ring-2 focus:ring-blue-500 ${disabled && formData[id] ? 'bg-blue-50 border-blue-200 text-blue-900 font-medium' : disabled ? 'bg-slate-100 border-slate-200 text-slate-500' : 'bg-white border-slate-300'}`}></textarea>
            );

            const renderRawData = (questionsObj, data) => (
                <div className="space-y-4">
                    {Object.entries(questionsObj).map(([cat, qs]) => (
                        <div key={cat}>
                            <h6 className="font-bold text-slate-700 border-b border-slate-200 pb-1 mb-2 text-xs uppercase">{cat}</h6>
                            <ul className="space-y-1">
                                {qs.map(q => {
                                    const val = data[q[0]];
                                    const ansText = val ? q[2][parseInt(val)-1] : '未回答';
                                    return <li key={q[0]} className="text-xs flex gap-2 border-b border-slate-100 pb-1 mb-1"><span className="text-slate-500 w-2/3">{q[1]}</span><span className={`w-1/3 font-bold ${val ? 'text-blue-700' : 'text-slate-400'}`}>{ansText}</span></li>;
                                })}
                            </ul>
                        </div>
                    ))}
                </div>
            );

            // ==========================================
            // ログイン画面 (本格的なモックUI)
            // ==========================================
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-100 relative overflow-hidden animate-fade-in-up">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
                            
                            <div className="text-center mb-6">
                                <Shield className="h-12 w-12 text-indigo-600 mx-auto mb-3" />
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight">就業支援プログラム<br/>ポータル</h1>
                                <span className="inline-block bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded mt-2">セキュリティ対策レベルⅡ 準拠 (MFA必須)</span>
                            </div>

                            {/* メール＆パスワード入力ステップ */}
                            {authStep === 'email_password' && (
                                <form onSubmit={handleAuthSubmit} className="space-y-4 animate-fade-in-up">
                                    <div className="bg-blue-50 p-3 rounded-lg text-xs text-blue-800 font-medium mb-4">
                                        <b>【テストログイン】</b><br/>
                                        任意のメールアドレスとパスワードを入力してください。<br/>
                                        ※「admin」を含むと管理者、「mgr」を含むと上司権限になります。
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">メールアドレス</label>
                                        <input type="email" value={authData.email} onChange={(e) => setAuthData({...authData, email: e.target.value})} required className="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">パスワード</label>
                                        <input type="password" value={authData.password} onChange={(e) => setAuthData({...authData, password: e.target.value})} required minLength={6} className="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all"/>
                                    </div>
                                    {authErrorMsg && <div className="p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200 font-medium leading-relaxed">{authErrorMsg}</div>}
                                    <button type="submit" className="w-full py-3 rounded-lg font-bold text-white shadow-md transition-all bg-indigo-600 hover:bg-indigo-700">次へ</button>
                                </form>
                            )}

                            {/* MFA (SMS認証) ステップ */}
                            {authStep === 'verify_signin' && (
                                <form onSubmit={handleMfaVerify} className="space-y-4 animate-fade-in-up">
                                    <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100 mb-4">
                                        <h3 className="font-bold text-indigo-900 flex items-center gap-2 mb-2"><Smartphone className="w-5 h-5"/> 多要素認証 (SMS)</h3>
                                        <p className="text-sm text-indigo-800">登録済みの携帯電話番号に6桁の認証コードを送信しました。</p>
                                        <p className="text-xs text-orange-600 font-bold mt-2">※テスト用は 123456 を入力してください。</p>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">認証コード (6桁)</label>
                                        <input type="text" value={verificationCode} onChange={(e) => setVerificationCode(e.target.value)} required maxLength={6} placeholder="123456" className="w-full p-3 text-center tracking-[0.5em] text-xl font-bold border border-slate-300 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all"/>
                                    </div>
                                    {authErrorMsg && <div className="p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200 font-medium">{authErrorMsg}</div>}
                                    <button type="submit" className="w-full py-3 rounded-lg font-bold text-white shadow-md transition-all bg-indigo-600 hover:bg-indigo-700">認証してログイン</button>
                                    <button type="button" onClick={() => {setAuthStep('email_password'); setAuthErrorMsg('');}} className="w-full mt-2 text-sm text-slate-500 hover:text-slate-700 font-bold text-center block">最初からやり直す</button>
                                </form>
                            )}

                            {/* 開発用クイックログイン（以前のもの） */}
                            <div className="mt-8 pt-6 border-t border-slate-200">
                                <p className="text-xs text-slate-500 font-bold text-center mb-3">【開発用】認証をスキップして各権限を確認</p>
                                <div className="grid grid-cols-2 gap-2">
                                    {ROLES.map(role => (
                                        <button key={role.id} type="button" onClick={() => handleDemoLogin(role.id)} className="p-2 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded flex items-center justify-center gap-1 transition-colors">
                                            <role.icon className="w-3 h-3"/> {role.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // アプリケーション UI
            // ==========================================
            const DialogComponent = () => dialog ? (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full animate-fade-in-up border border-slate-200">
                        <div className="flex items-center gap-3 mb-4">
                            {dialog.type === 'confirm' ? <AlertTriangle className="w-6 h-6 text-orange-500"/> : <CheckCircle className="w-6 h-6 text-blue-600"/>}
                            <h3 className="font-bold text-lg text-slate-800">{dialog.type === 'confirm' ? '確認' : 'お知らせ'}</h3>
                        </div>
                        <p className="text-slate-600 mb-6 font-medium whitespace-pre-wrap">{dialog.message}</p>
                        <div className="flex justify-end gap-3">
                            {dialog.type === 'confirm' && <button onClick={() => setDialog(null)} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition">キャンセル</button>}
                            <button onClick={() => { if(dialog.type==='confirm') dialog.onConfirm(); else setDialog(null); }} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-sm transition">OK</button>
                        </div>
                    </div>
                </div>
            ) : null;

            const Header = () => {
                const CurrentRoleIcon = ROLES.find(r => r.id === currentRole)?.icon || UserIcon;
                const roleLabel = ROLES.find(r => r.id === currentRole)?.label;
                return (
                    <header className="bg-blue-900 text-white shadow-md sticky top-0 z-50 print:hidden">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2"><HeartPulse className="h-6 w-6 text-red-400" /><h1 className="text-xl font-bold tracking-wider hidden sm:block">就業支援ポータル</h1></div>
                            <div className="flex items-center gap-4 text-sm bg-blue-800 py-1 px-3 rounded-lg border border-blue-700">
                                <div className="flex items-center gap-2 text-blue-100 pr-4 border-r border-blue-700"><CurrentRoleIcon className="w-4 h-4" /><span className="font-bold">{roleLabel}</span></div>
                                <button onClick={handleLogout} className="flex items-center gap-1 text-white hover:text-red-300 transition-colors"><LogOut className="w-4 h-4" /> ログアウト</button>
                            </div>
                        </div>
                    </header>
                );
            };

            if (!selectedUser && currentRole !== 'employee') {
                return (
                    <div className="min-h-screen flex flex-col bg-slate-50">
                        <Header />
                        <DialogComponent />
                        <main className="flex-grow p-4 sm:p-6 max-w-7xl mx-auto w-full animate-fade-in-up">

                                </div>
                                <div className="p-6">
                                    <div className="space-y-4 mb-6 max-h-60 overflow-y-auto pr-2">
                                        {contacts.map((log, idx) => (
                                            <div key={idx} className="flex gap-4">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 text-white font-bold shadow-sm ${log.role === 'ohp' ? 'bg-red-400' : log.role === 'manager' ? 'bg-emerald-500' : log.role === 'system' ? 'bg-purple-500' : 'bg-slate-400'}`}>
                                                    {log.role === 'ohp' ? '医' : log.role === 'manager' ? '職' : log.role === 'system' ? '機' : '管'}
                                                </div>
                                                <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl flex-grow shadow-sm relative">
                                                    <div className="absolute top-4 -left-2 w-4 h-4 bg-slate-50 border-l border-b border-slate-200 transform rotate-45"></div>
                                                    <div className="flex justify-between items-center mb-1 relative z-10"><span className="text-xs font-bold text-slate-700">{log.author}</span><span className="text-[10px] text-slate-400">{log.date}</span></div>
                                                    <p className="text-sm text-slate-800 whitespace-pre-wrap relative z-10 leading-relaxed">{log.text}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-3">
                                        <input type="text" value={newContactMsg} onChange={e => setNewContactMsg(e.target.value)} placeholder="連絡内容を入力..." className="flex-grow p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" onKeyPress={(e) => { if(e.key === 'Enter') addContactLog(newContactMsg); }}/>
                                        <button onClick={() => addContactLog(newContactMsg)} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 rounded-xl transition-colors shadow-sm flex items-center gap-2"><Send className="w-4 h-4"/> 送信</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* PDF出力用非表示レイアウト */}
                    <div className="print-only hidden print:block bg-white text-black p-8 text-sm max-w-4xl mx-auto">
                        <h1 className="text-2xl font-black text-center border-b-2 border-black pb-4 mb-8">職場復帰支援プラン（判定・配慮事項 記録）</h1>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">1. 対象者情報</h2>
                            <table className="w-full border-collapse border border-black text-left">
                                <tbody>
                                    <tr><th className="border border-black p-2 bg-gray-100 w-1/4">氏名</th><td className="border border-black p-2">{formData.name || '未入力'}</td><th className="border border-black p-2 bg-gray-100 w-1/4">社員番号</th><td className="border border-black p-2">{formData.empId || '未入力'}</td></tr>
                                    <tr><th className="border border-black p-2 bg-gray-100">所属部署</th><td colSpan="3" className="border border-black p-2">{formData.department || '未入力'}</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">2. 就業判定結果（産業医・保健師）</h2>
                            <div className="p-4 border border-black min-h-[60px] font-bold text-lg">
                                {formData.route === 'A' || formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '① 通常就業可 (制限・配慮なし)' : 
                                 formData.doctor_final_judgment === 'restricted' ? '② 就業制限・配慮が必要 (条件付き就業可)' : 
                                 formData.doctor_final_judgment === 'impossible' ? '③ 就業不可 (療養継続)' : '未判定'}
                            </div>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">3. 就業上の配慮・条件（専門職指示）</h2>
                            <div className="p-4 border border-black min-h-[120px] whitespace-pre-wrap">
                                {formData.condition_text || (formData.route === 'A' || formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '特になし（通常就業のため制限事項なし）' : '未入力')}
                            </div>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">4. 職場（職制）での受け入れ確認</h2>
                            <table className="w-full border-collapse border border-black text-left">
                                <tbody>
                                    <tr>
                                        <th className="border border-black p-2 bg-gray-100 w-1/3">配慮の受け入れ可否</th>
                                        <td className="border border-black p-2">
                                            {formData.mgr_accept_pg === 'yes' ? '受け入れ可能 (復帰に同意する)' : 
                                             formData.mgr_accept_pg === 'no' ? '受け入れ困難 (現場の体制的に厳しい)' : 
                                             formData.route === 'A' || formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '配慮不要（通常就業のため）' : '未確認'}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-16 text-right"><p className="text-sm font-bold">出力日: {new Date().toLocaleDateString('ja-JP')}</p><p className="text-xs text-gray-500 mt-2">※本書類は要配慮個人情報を含みます。取り扱いには十分注意してください。</p></div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
