        // --- 高速化キャッシュ付き 日本の祝日判定ヘルパー ---
        const holidayCache = new Map();

        const getNthMondayDay = (year, month, nth) => {
            const firstDow = new Date(year, month - 1, 1).getDay();
            const firstMonday = 1 + ((8 - firstDow) % 7);
            return firstMonday + (nth - 1) * 7;
        };

        const getVernalEquinoxDay = (year) => Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        const getAutumnalEquinoxDay = (year) => Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));

        const getBaseJapaneseHolidayName = (year, month, day) => {
            if (month === 1 && day === 1) return '元日';
            if (month === 1 && day === getNthMondayDay(year, 1, 2)) return '成人の日';
            if (month === 2 && day === 11) return '建国記念の日';
            if (month === 2 && day === 23 && year >= 2020) return '天皇誕生日';
            if (month === 3 && day === getVernalEquinoxDay(year)) return '春分の日';
            if (month === 4 && day === 29) return '昭和の日';
            if (month === 5 && day === 3) return '憲法記念日';
            if (month === 5 && day === 4) return 'みどりの日';
            if (month === 5 && day === 5) return 'こどもの日';
            if (month === 7 && day === getNthMondayDay(year, 7, 3)) return '海の日';
            if (month === 8 && day === 11) return '山の日';
            if (month === 9 && day === getNthMondayDay(year, 9, 3)) return '敬老の日';
            if (month === 9 && day === getAutumnalEquinoxDay(year)) return '秋分の日';
            if (month === 10 && day === getNthMondayDay(year, 10, 2)) return 'スポーツの日';
            if (month === 11 && day === 3) return '文化の日';
            if (month === 11 && day === 23) return '勤労感謝の日';
            return '';
        };

        const getJapaneseHolidayName = (year, month, day) => {
            const cacheKey = `${year}-${month}-${day}`;
            if (holidayCache.has(cacheKey)) return holidayCache.get(cacheKey);

            let result = getBaseJapaneseHolidayName(year, month, day);
            if (!result) {
                const targetDate = new Date(year, month - 1, day);
                const dow = targetDate.getDay();
                if (dow !== 0) {
                    const prev = new Date(year, month - 1, day - 1);
                    const next = new Date(year, month - 1, day + 1);
                    if (
                        getBaseJapaneseHolidayName(prev.getFullYear(), prev.getMonth() + 1, prev.getDate()) &&
                        getBaseJapaneseHolidayName(next.getFullYear(), next.getMonth() + 1, next.getDate())
                    ) {
                        result = '国民の休日';
                    }
                }
                if (!result && dow !== 0) {
                    for (let back = 1; back <= 6; back++) {
                        const prev = new Date(year, month - 1, day - back);
                        const prevBase = getBaseJapaneseHolidayName(prev.getFullYear(), prev.getMonth() + 1, prev.getDate());
                        if (!prevBase) break;
                        if (prev.getDay() === 0) {
                            result = '振替休日';
                            break;
                        }
                    }
                }
            }
            holidayCache.set(cacheKey, result);
            return result;
        };

        // --- 日付・勤続年数・営業日計算ヘルパー ---
        const parseDateStr = (str) => {
            if (!str) return null;
            const parts = str.split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return null;
            return new Date(parts[0], parts[1] - 1, parts[2]);
        };

        const formatDateObj = (d) => {
            if (!d || isNaN(d.getTime())) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const addDaysToDateStr = (dateStr, days) => {
            const d = parseDateStr(dateStr);
            if (!d) return '';
            d.setDate(d.getDate() + days);
            return formatDateObj(d);
        };

        const isWorkdayJapan = (dateStr, companyHolidays = {}) => {
            const d = parseDateStr(dateStr);
            if (!d) return false;
            const dow = d.getDay();
            if (dow === 0 || dow === 6) return false;
            if (getJapaneseHolidayName(d.getFullYear(), d.getMonth() + 1, d.getDate())) return false;
            if (companyHolidays && companyHolidays[dateStr]) return false;
            return true;
        };

        // ファイル名から日付を自動抽出するヘルパー（診断書の日付読み取り用）
        const extractDateFromFileName = (fileName) => {
            if (!fileName) return '';
            // 2026-11-24 / 2026_11_24 / 2026.11.24 / 2026年11月24日
            const sepMatch = fileName.match(/(20\d{2})[-_年\.\/](\d{1,2})[-_月\.\/](\d{1,2})/);
            if (sepMatch) {
                const y = sepMatch[1];
                const m = String(Number(sepMatch[2])).padStart(2, '0');
                const d = String(Number(sepMatch[3])).padStart(2, '0');
                if (Number(m) >= 1 && Number(m) <= 12 && Number(d) >= 1 && Number(d) <= 31) {
                    return `${y}-${m}-${d}`;
                }
            }
            // 20261124 (8桁連続数字)
            const compactMatch = fileName.match(/(20\d{2})(\d{2})(\d{2})/);
            if (compactMatch) {
                const y = compactMatch[1];
                const m = compactMatch[2];
                const d = compactMatch[3];
                if (Number(m) >= 1 && Number(m) <= 12 && Number(d) >= 1 && Number(d) <= 31) {
                    return `${y}-${m}-${d}`;
                }
            }
            // 令和表記 R8.11.24 / 令和8年11月24日
            const reiwaMatch = fileName.match(/(?:R|令和)\s*(\d{1,2})[-_年\.\/](\d{1,2})[-_月\.\/](\d{1,2})/i);
            if (reiwaMatch) {
                const y = 2018 + Number(reiwaMatch[1]);
                const m = String(Number(reiwaMatch[2])).padStart(2, '0');
                const d = String(Number(reiwaMatch[3])).padStart(2, '0');
                if (Number(m) >= 1 && Number(m) <= 12 && Number(d) >= 1 && Number(d) <= 31) {
                    return `${y}-${m}-${d}`;
                }
            }
            return '';
        };

        const calculateTenureAndLeaveLimit = (hireDateStr, referenceDateStr) => {
            const hire = parseDateStr(hireDateStr);
            if (!hire) return null;
            const refDate = parseDateStr(referenceDateStr) || new Date();
            if (refDate < hire) {
                return { years: 0, months: 0, categoryLabel: '満3年未満', leaveMonths: 9, endDateEstimate: '' };
            }

            let totalMonths = (refDate.getFullYear() - hire.getFullYear()) * 12 + (refDate.getMonth() - hire.getMonth());
            if (refDate.getDate() < hire.getDate()) totalMonths -= 1;
            totalMonths = Math.max(0, totalMonths);
            const years = Math.floor(totalMonths / 12);
            const months = totalMonths % 12;

            let categoryLabel = '';
            let leaveMonths = 9;
            if (years < 3) {
                categoryLabel = '満3年未満';
                leaveMonths = 9;
            } else if (years < 10) {
                categoryLabel = '満3年以上〜満10年未満';
                leaveMonths = 21;
            } else {
                categoryLabel = '満10年以上';
                leaveMonths = 33;
            }

            let endDateEstimate = '';
            if (referenceDateStr) {
                const startObj = parseDateStr(referenceDateStr);
                if (startObj) {
                    const endObj = new Date(startObj.getFullYear(), startObj.getMonth() + leaveMonths, startObj.getDate());
                    endDateEstimate = formatDateObj(endObj);
                }
            }

            return { years, months, categoryLabel, leaveMonths, endDateEstimate };
        };

            const normalizeCsvDateStr = (raw) => {
                if (!raw) return '';
                const cleaned = raw.trim().replace(/^["']|["']$/g, '').replace(/[年\/\.]/g, '-').replace(/日/g, '');
                const parts = cleaned.split('-').map(p => p.trim());
                if (parts.length !== 3) return '';
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const d = parseInt(parts[2], 10);
                if (isNaN(y) || isNaN(m) || isNaN(d) || y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return '';
                return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

                    let text = new TextDecoder('utf-8').decode(buffer);
                    if (text.includes('\uFFFD')) {
                        text = new TextDecoder('shift-jis').decode(buffer);
                    }
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    const parsedMap = {};
                    let importedCount = 0;

                    lines.forEach((line) => {
                        const cols = line.split(/[,\t]/).map(c => c.trim().replace(/^["']|["']$/g, ''));
                        const dateStr = normalizeCsvDateStr(cols[0]);
                        if (dateStr) {
                            parsedMap[dateStr] = cols[1] ? cols[1] : '会社休日';
                            importedCount++;
                        }

            const computePatternStats = useCallback((pat) => {
                let usedPaid = 0;
                let usedLS = 0;
                let absenceDays = 0;
                let kyushokuDays = 0;
                let firstAbsenceDate = '';
                let absence60thDate = '';
                let firstKyushokuDate = '';
                let firstLeaveDate = '';
                let lastLeaveDate = '';

                if (pat.mode === 'manual') {
                    usedPaid = Math.min(Math.max(0, Number(pat.plannedPaid) || 0), simPaidLeave);
                    usedLS = Math.min(Math.max(0, Number(pat.plannedLS) || 0), simLifeSupport);
                    const totalNonLeave = Math.max(0, Number(pat.manualAbsence) || 0) + Math.max(0, Number(pat.manualKyushoku) || 0);
                    absenceDays = Math.min(totalNonLeave, 60);
                    kyushokuDays = Math.max(0, totalNonLeave - 60);

                    const manualCursor = parseDateStr(simStartDate);
                    if (manualCursor) {
                        let leaveRemain = usedPaid + usedLS;
                        let guard = 0;
                        while (leaveRemain > 0 && guard < 400) {
                            guard++;
                            const ds = formatDateObj(manualCursor);
                            if (isWorkdayJapan(ds, companyHolidays)) {
                                if (!firstLeaveDate) firstLeaveDate = ds;
                                lastLeaveDate = ds;
                                leaveRemain--;
                            }
                            manualCursor.setDate(manualCursor.getDate() + 1);
                        }
                        while (!isWorkdayJapan(formatDateObj(manualCursor), companyHolidays) && guard < 450) {
                            guard++;
                            manualCursor.setDate(manualCursor.getDate() + 1);
                        }
                        firstAbsenceDate = formatDateObj(manualCursor);

                        let absCount = 0;
                        while (absCount < absenceDays && guard < 600) {
                            guard++;
                            const ds = formatDateObj(manualCursor);
                            if (isWorkdayJapan(ds, companyHolidays)) {
                                absCount++;
                                if (absCount === 60) absence60thDate = ds;
                            }
                            manualCursor.setDate(manualCursor.getDate() + 1);
                        }
                        if (kyushokuDays > 0) {
                            while (!isWorkdayJapan(formatDateObj(manualCursor), companyHolidays) && guard < 650) {
                                guard++;
                                manualCursor.setDate(manualCursor.getDate() + 1);
                            }
                            firstKyushokuDate = formatDateObj(manualCursor);
                        }
                    }
                } else {
                    const map = pat.calendarMap || {};
                    const sortedKeys = Object.keys(map).sort();
                    let rawAbsenceCount = 0;

                    sortedKeys.forEach((dStr) => {
                        const t = map[dStr];
                        if (t === 'paid') {
                            usedPaid++;
                            if (!firstLeaveDate) firstLeaveDate = dStr;
                            lastLeaveDate = dStr;
                        } else if (t === 'ls') {
                            usedLS++;
                            if (!firstLeaveDate) firstLeaveDate = dStr;
                            lastLeaveDate = dStr;
                        } else if (t === 'absence') {
                            rawAbsenceCount++;
                            if (!firstAbsenceDate) firstAbsenceDate = dStr;
                            if (rawAbsenceCount <= 60) {
                                absenceDays++;
                                if (rawAbsenceCount === 60) absence60thDate = dStr;
                            } else {
                                kyushokuDays++;
                                if (!firstKyushokuDate) firstKyushokuDate = dStr;
                            }
                        } else if (t === 'kyushoku') {
                            kyushokuDays++;
                            if (!firstKyushokuDate) firstKyushokuDate = dStr;
                        }
                    });

                    if (!firstAbsenceDate && sortedKeys.length === 0) {
                        const pPaid = Math.min(Number(pat.plannedPaid) || 0, simPaidLeave);
                        const pLS = Math.min(Number(pat.plannedLS) || 0, simLifeSupport);
                        const fallbackCursor = parseDateStr(simStartDate);
                        if (fallbackCursor) {
                            let rem = pPaid + pLS;
                            let guard = 0;
                            while (rem > 0 && guard < 400) {
                                guard++;
                                const ds = formatDateObj(fallbackCursor);
                                if (isWorkdayJapan(ds, companyHolidays)) {
                                    if (!firstLeaveDate) firstLeaveDate = ds;
                                    lastLeaveDate = ds;
                                    rem--;
                                }
                                fallbackCursor.setDate(fallbackCursor.getDate() + 1);
                            }
                            while (!isWorkdayJapan(formatDateObj(fallbackCursor), companyHolidays) && guard < 450) {
                                guard++;
                                fallbackCursor.setDate(fallbackCursor.getDate() + 1);
                            }
                            firstAbsenceDate = formatDateObj(fallbackCursor);
                        }
                    }
                }

                const totalAbsenceAndKyushoku = absenceDays + kyushokuDays;
                const totalDays = usedPaid + usedLS + totalAbsenceAndKyushoku;
                const remainPaid = simPaidLeave - usedPaid;
                const remainLS = simLifeSupport - usedLS;
                const reaches61Days = kyushokuDays > 0 || totalAbsenceAndKyushoku >= 61;
                const estimatedKyushokuStart = firstKyushokuDate || (absence60thDate ? addDaysToDateStr(absence60thDate, 1) : '');

                return {
                    usedPaid, usedLS, absenceDays, kyushokuDays, totalAbsenceAndKyushoku, totalDays,
                    remainPaid, remainLS, reaches61Days, firstLeaveDate, lastLeaveDate,
                    firstAbsenceDate, absence60thDate, estimatedKyushokuStart
                };
            }, [simPaidLeave, simLifeSupport, simStartDate, companyHolidays]);

            // 全3パターンの統計をメモ化（他のフォーム文字入力時には再計算されない）
            const simStatsMap = useMemo(() => ({
                A: computePatternStats(simPatterns.A),
                B: computePatternStats(simPatterns.B),
                C: computePatternStats(simPatterns.C)
            }), [simPatterns, computePatternStats]);

            const getPatternStats = (patKeyOrObj) => {
                if (typeof patKeyOrObj === 'string' && simStatsMap[patKeyOrObj]) {
                    return simStatsMap[patKeyOrObj];
                }
                return computePatternStats(patKeyOrObj);
            };

            const stampSimSavedTime = () => {
                const nowStr = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setSimLastSavedAt(nowStr);
                return nowStr;
            };

            const updateSimPattern = (patternKey, updater) => {
                const currentPat = simPatterns[patternKey];
                const nextPat = typeof updater === 'function' ? updater(currentPat) : { ...currentPat, ...updater };
                const nextPatterns = { ...simPatterns, [patternKey]: nextPat };
                const savedTime = stampSimSavedTime();
                saveData({ sim_patterns: nextPatterns, sim_last_saved_at: savedTime });
            };

            const applyShiftedScheduleToCalendar = (patternKey, nextPaidRaw, nextLSRaw) => {
                let cappedPaid = Math.max(0, Math.floor(Number(nextPaidRaw) || 0));
                let cappedLS = Math.max(0, Math.floor(Number(nextLSRaw) || 0));

                if (cappedPaid > simPaidLeave) {
                    cappedPaid = simPaidLeave;
                    showToast(`有休残日数（${simPaidLeave}日）を超える使用日数は入力できません。`, "warning");
                }
                if (cappedLS > simLifeSupport) {
                    cappedLS = simLifeSupport;
                    showToast(`ライフサポート残日数（${simLifeSupport}日）を超える使用日数は入力できません。`, "warning");
                }

                const newCal = {};
                const startObj = parseDateStr(simStartDate);
                const endObj = parseDateStr(simEndDate);

                if (startObj && endObj && startObj <= endObj) {
                    let remPaid = cappedPaid;
                    let remLS = cappedLS;
                    let absAssigned = 0;
                    const shiftCursor = new Date(startObj);
                    while (shiftCursor <= endObj) {
                        const ds = formatDateObj(shiftCursor);
                        if (isWorkdayJapan(ds, companyHolidays)) {
                            if (remPaid > 0) {
                                newCal[ds] = 'paid';
                                remPaid--;
                            } else if (remLS > 0) {
                                newCal[ds] = 'ls';
                                remLS--;
                            } else if (absAssigned < 60) {
                                newCal[ds] = 'absence';
                                absAssigned++;
                            } else {
                                newCal[ds] = 'kyushoku';
                            }
                        }
                        shiftCursor.setDate(shiftCursor.getDate() + 1);
                    }
                }

                updateSimPattern(patternKey, {
                    plannedPaid: cappedPaid,
                    plannedLS: cappedLS,
                    calendarMap: newCal
                });
            };

            const handleCalendarDayClick = (dateStr) => {
                if (!canEditSim) return;
                const currentPat = simPatterns[activeSimPattern];
                const curMap = { ...(currentPat.calendarMap || {}) };
                const curVal = curMap[dateStr] || '';

                const curPaidCount = Object.values(curMap).filter(v => v === 'paid').length;
                const curLSCount = Object.values(curMap).filter(v => v === 'ls').length;

                let nextVal = '';
                if (curVal === '') {
                    if (curPaidCount < simPaidLeave) nextVal = 'paid';
                    else if (curLSCount < simLifeSupport) {
                        nextVal = 'ls';
                        showToast(`有休残日数（${simPaidLeave}日）の上限に達しているため、LSを選択しました。`, "info");
                    } else {
                        nextVal = 'absence';
                        showToast("有休・LSの残日数をすべて使用済みのため、私傷病欠勤を選択しました。", "info");
                    }
                } else if (curVal === 'paid') {
                    if (curLSCount < simLifeSupport) nextVal = 'ls';
                    else {
                        nextVal = 'absence';
                        showToast(`ライフサポート残日数（${simLifeSupport}日）の上限に達しているため、私傷病欠勤を選択しました。`, "info");
                    }
                } else if (curVal === 'ls') {
                    nextVal = 'absence';
                } else if (curVal === 'absence') {
                    nextVal = 'kyushoku';
                } else {
                    nextVal = '';
                }

                if (nextVal === '') delete curMap[dateStr];
                else curMap[dateStr] = nextVal;

                const nextPaidCount = Object.values(curMap).filter(v => v === 'paid').length;
                const nextLSCount = Object.values(curMap).filter(v => v === 'ls').length;

                updateSimPattern(activeSimPattern, {
                    plannedPaid: nextPaidCount,
                    plannedLS: nextLSCount,
                    calendarMap: curMap
                });
            };

            const handleBulkCalendarAction = (action) => {
                if (!canEditSim) return;
                const startObj = parseDateStr(simStartDate);
                const endObj = parseDateStr(simEndDate);
                if (!startObj || !endObj || startObj > endObj) {
                    showToast("休業開始予定日と終了予定日を正しく設定してください。", "error");
                    return;
                }
                const currentPat = simPatterns[activeSimPattern];
                const curMap = { ...(currentPat.calendarMap || {}) };

                if (action === 'clear') {
                    updateSimPattern(activeSimPattern, { plannedPaid: 0, plannedLS: 0, calendarMap: {} });
                    showToast(`パターン${activeSimPattern}のカレンダー設定をクリアしました。`, "info");
                    return;
                }
                if (action === 'auto_sequence_all') {
                    const useP = Math.min(Number(currentPat.plannedPaid) ?? simPaidLeave, simPaidLeave);
                    const useL = Math.min(Number(currentPat.plannedLS) ?? simLifeSupport, simLifeSupport);
                    applyShiftedScheduleToCalendar(activeSimPattern, useP, useL);
                    showToast("①有休・LS → ②私傷病欠勤(最大60日) → ③休職(61日目〜) を自動配置しました。", "success");
                    return;
                }
                if (action === 'first3_paid') {
                    let count = 0;
                    const maxCanUse = Math.min(3, simPaidLeave);
                    const bulkCursor = new Date(startObj);
                    while (bulkCursor <= endObj && count < maxCanUse) {
                        const ds = formatDateObj(bulkCursor);
                        if (isWorkdayJapan(ds, companyHolidays)) {
                            curMap[ds] = 'paid';
                            count++;
                        }
                        bulkCursor.setDate(bulkCursor.getDate() + 1);
                    }
                    const nextPaid = Object.values(curMap).filter(v => v === 'paid').length;
                    updateSimPattern(activeSimPattern, { plannedPaid: nextPaid, calendarMap: curMap });
                    showToast(`開始日から平日${count}日を有休に設定しました。`, "success");
                } else if (action === 'fill_step2_absence60') {
                    let absCount = Object.values(curMap).filter(v => v === 'absence').length;
                    const bulkCursor = new Date(startObj);
                    while (bulkCursor <= endObj && absCount < 60) {
                        const ds = formatDateObj(bulkCursor);
                        if (isWorkdayJapan(ds, companyHolidays) && !curMap[ds]) {
                            curMap[ds] = 'absence';
                            absCount++;
                        }
                        bulkCursor.setDate(bulkCursor.getDate() + 1);
                    }
                    updateSimPattern(activeSimPattern, { calendarMap: curMap });
                    showToast("未設定の平日を「② 私傷病欠勤（最大60日まで）」に設定しました。", "success");
                } else if (action === 'fill_step3_kyushoku') {
                    let absCount = Object.values(curMap).filter(v => v === 'absence').length;
                    const bulkCursor = new Date(startObj);
                    while (bulkCursor <= endObj) {
                        const ds = formatDateObj(bulkCursor);
                        if (isWorkdayJapan(ds, companyHolidays) && !curMap[ds]) {
                            if (absCount < 60) {
                                curMap[ds] = 'absence';
                                absCount++;
                            } else {
                                curMap[ds] = 'kyushoku';
                            }
                        }
                        bulkCursor.setDate(bulkCursor.getDate() + 1);
                    }
                    updateSimPattern(activeSimPattern, { calendarMap: curMap });
                    showToast("61日目以降の平日を「③ 休職」に設定しました。", "success");
                }
            };

            const shiftCalMonth = (delta) => {
                const [y, m] = simCalMonth.split('-').map(Number);
                const d = new Date(y, m - 1 + delta, 1);
                setSimCalMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
            };

            const calculateRiskScore = () => {
                let score = 0; let reasons = []; 
                const addReason = (item, points, source) => { reasons.push({ item, points, source }); score += points; };

                if (formData.emp_q0_2 === '2') addReason('主治医から就業制限あり', 5, '本人回答');
                if (formData.emp_q0_1 === '4') addReason('復職可能と言われていない', 15, '本人回答');
                if (formData.emp_q1_2 === '4' || formData.emp_q1_3 === '3' || formData.emp_q1_3 === '4') addReason('勤務継続に「難しい・不安」がある', 5, '本人回答');
                if (formData.emp_q3_2 === '4' || formData.emp_q3_3 === '4') addReason('睡眠が不安定・不足している', 5, '本人回答');
                if (formData.emp_q2_1 === '3' || formData.emp_q3_4 === '3' || formData.emp_q3_4 === '4') addReason('強い眠気や集中力低下がある', 5, '本人回答');
                if (formData.emp_q2_2 === '3') addReason('めまい・ふらつき・失神等の不安がある', 5, '本人回答');
                if (formData.emp_q5_1 === '4') addReason('復職への「とても強い不安」がある', 5, '本人回答');
                if (formData.emp_q5_2 === '3' || formData.emp_q5_2 === '4') addReason('職場の人間関係に強い不安がある', 5, '本人回答');
                if (formData.emp_q4c_1 === '3' || formData.emp_q4c_2 === '4' || formData.emp_q4c_5 === '3') addReason('交替勤務復帰への強い不安がある', 5, '本人回答');
                if (formData.emp_q1_4 === '4') addReason('直近の体調が不安定である', 5, '本人回答');

                if (formData.mgr_q2_1 === '3') addReason('業務に安全上の懸念あり(職制評価)', 15, '職制評価');
                if (formData.mgr_q2_4 === '3') addReason('必要な配慮の実施が現場で困難', 15, '職制評価');
                if (formData.mgr_q0_3 === '3' || formData.mgr_q0_3 === '4') addReason('復職後の業務内容が未定', 5, '職制評価');
                if (formData.mgr_q2_5 === '3') addReason('単独作業や危険作業を避けられない', 10, '職制評価');
                if (formData.mgr_q4c_1 === '3') addReason('交替勤務をすぐ再開する必要がある', 5, '職制評価');
                if (formData.mgr_q5_4 === '2') addReason('職場として受入れに強い懸念がある', 10, '職制評価');
                if (formData.mgr_q5_5 === '2') addReason('職制が保健師相談を希望している', 3, '職制評価');
                if (formData.mgr_q5_5 === '3') addReason('職制が産業医相談を希望している', 5, '職制評価'); 

                let level = 0;
                if (score >= 15) level = 3; else if (score >= 10) level = 2; else if (score >= 3) level = 1; else level = 0;
                return { score, level, reasons };
            };

            const getIdleDays = (lastUpdated) => { if (!lastUpdated) return 0; return Math.floor(Math.abs(Date.now() - lastUpdated) / (1000 * 60 * 60 * 24)); };

            const checkEvaluationGap = () => {
                if (actualPhase !== 4) return false;
                for (let q of ['1', '2', '3']) {
                    const empVal = formData[`emp_q${q}`]; const mgrVal = formData[`mgr_q${q}`];
                    if (empVal && mgrVal && Math.abs(parseInt(empVal) - parseInt(mgrVal)) >= 1) return true;
                }
                return false;
            };
            const hasEvalGap = checkEvaluationGap();

            const handleExportCSV = () => {
                let csvContent = "\uFEFFデータ項目,入力値\n";
                Object.keys(formData).forEach(key => {
                    if (key === 'contact_logs' || key === 'sim_patterns' || key === 'shobyo_applications' || key === 'medical_certificates') return; 
                    let val = formData[key] || '';
                    if (typeof val === 'string') { val = val.replace(/"/g, '""'); if (val.search(/("|,|\n)/g) >= 0) val = `"${val}"`; }
                    csvContent += `${key},${val}\n`;
                });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([csvContent], { type: "text/csv;charset=utf-8;" }));
                link.download = `data_${formData.empId || 'unknown'}_${formData.name || 'unknown'}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            // --- 画像圧縮フォールバックヘルパー ---
            const compressImageToDataUrl = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const maxDim = 1200;
                            let w = img.width;
                            let h = img.height;
                            if (w > maxDim || h > maxDim) {
                                if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                                else { w = Math.round((w * maxDim) / h); h = maxDim; }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.72));
                        };
                        img.onerror = reject;
                        img.src = ev.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            // --- 傷病手当金 申請・FAX管理表 ハンドラ（本人随時アップロード＆職制経由通知対応） ---
            const canViewShobyo = isAdmin || canEdit('employee') || canEdit('manager') || canEdit('ohp');
            const canEditShobyoHR = isAdmin;
            const canUploadShobyoEmp = isAdmin || canEdit('employee');
            const canForwardShobyoMgr = isAdmin || canEdit('manager');
            const shobyoList = formData.shobyo_applications || [];
            const linkedSimKey = formData.sim_adopted_pattern || activeSimPattern;
            const linkedSimStats = simStatsMap[linkedSimKey];

            // 本人が私傷病手当申請書をアップロードして職制へ通知する
            const handleSubmitShobyoByEmployee = async (e) => {
                e.preventDefault();
                if (!canUploadShobyoEmp) return;
                if (!shobyoUploadFile) {
                    showToast("アップロードする私傷病手当申請書（PDFまたは画像）を選択してください。", "warning");
                    return;
                }
                setIsUploadingShobyo(true);
                try {
                    const caseId = formData.id || `case_${Date.now()}`;
                    const nextRound = shobyoList.length + 1;
                    const itemId = `shobyo_${Date.now()}`;
                    let downloadUrl = '';
                    let storagePath = '';

                    if (isDemoMode) {
                        downloadUrl = URL.createObjectURL(shobyoUploadFile);
                    } else {
                        try {
                            storagePath = `shobyo_forms/${caseId}/${itemId}_${shobyoUploadFile.name}`;
                            const storageRef = ref(storage, storagePath);
                            await uploadBytes(storageRef, shobyoUploadFile);
                            downloadUrl = await getDownloadURL(storageRef);
                        } catch (err) {
                            if (shobyoUploadFile.type.startsWith('image/')) {
                                downloadUrl = await compressImageToDataUrl(shobyoUploadFile);
                                storagePath = '';
                            } else {
                                showToast("PDFの保存にはFirebase Storageの有効化が必要です（スマホ写真JPG/PNGであればそのまま保存できます）。", "error");
                                setIsUploadingShobyo(false);
                                return;
                            }
                        }
                    }

                    const autoStart = shobyoUploadPeriodStart || (nextRound === 1 ? (linkedSimStats.firstAbsenceDate || simStartDate) : '');
                    const newItem = {
                        id: itemId,
                        round: nextRound,
                        periodStart: autoStart,
                        periodEnd: shobyoUploadPeriodEnd || '',
                        status: 'mgr_review', // mgr_review(職制確認待ち) | hr_checking(人事・保健師へ回付済) | fax_sent(健保FAX送信済) | completed(支給完了)
                        fileName: shobyoUploadFile.name,
                        fileType: shobyoUploadFile.type || 'application/octet-stream',
                        downloadUrl,
                        storagePath,
                        empUploadedAt: new Date().toLocaleString('ja-JP'),
                        empUploadedBy: `${currentUser?.name || '本人'}`,
                        mgrForwardedAt: '',
                        mgrForwardedBy: '',
                        chkDoctorSign: false,
                        chkWaitingDays: nextRound === 1 && linkedSimStats.usedPaid >= 3,
                        chkAttendanceSheet: false,
                        faxSentDate: '',
                        faxSender: '',
                        faxControlNo: '',
                        memo: shobyoUploadMemo.trim()
                    };

                    const logText = `【私傷病手当申請書 提出】第${nextRound}回申請書（${shobyoUploadFile.name}）が本人からアップロードされました（職制確認待ち）。`;
                    const newLog = { date: new Date().toLocaleString('ja-JP'), text: logText, author: 'システム', role: 'system' };

                    await saveData({
                        id: caseId,
                        shobyo_applications: [...shobyoList, newItem],
                        contact_logs: [...(formData.contact_logs || []), newLog]
                    });

                    const mgrEmail = usersList.find(u => u.id === formData.assigned_manager_id)?.email || formData.manager_email || '';
                    const subject = `【就業支援ポータル】私傷病手当申請書の提出・確認依頼 (${formData.name}さん 第${nextRound}回)`;
                    const body = `職制担当者 様\n\n${formData.name} さんから「私傷病手当申請書（第${nextRound}回）」がアップロードされました。\nポータルにて書類をご確認のうえ、人事・保健師への回付処理をお願いいたします。\n\n■ 申請対象期間：${autoStart || '未指定'} 〜 ${shobyoUploadPeriodEnd || '未指定'}\n■ 添付ファイル：${shobyoUploadFile.name}\n${shobyoUploadMemo.trim() ? `■ 本人メモ：${shobyoUploadMemo.trim()}\n` : ''}\n▼就業支援ポータル\n${getPortalUrl()}`;

                    setShobyoUploadFile(null);
                    setShobyoUploadPeriodStart('');
                    setShobyoUploadPeriodEnd('');
                    setShobyoUploadMemo('');
                    const el = document.getElementById('shobyo-file-input');
                    if (el) el.value = '';

                    setEmailDraft({
                        to: mgrEmail,
                        subject,
                        body,
                        onClose: () => {}
                    });
                    showToast("私傷病手当申請書をアップロードしました！職制宛の通知メール文面を作成しました。", "success");
                } finally {
                    setIsUploadingShobyo(false);
                }
            };

            // 職制が受領確認し、人事・保健師へ回付する
            const handleForwardShobyoByManager = (item) => {
                if (!canForwardShobyoMgr) return;
                const nowStr = new Date().toLocaleString('ja-JP');
                const updated = shobyoList.map(s => s.id === item.id ? {
                    ...s,
                    status: 'hr_checking',
                    mgrForwardedAt: nowStr,
                    mgrForwardedBy: `${currentUser?.name || '職制'}`
                } : s);

                const logText = `【私傷病手当申請書 職制回付】第${item.round}回申請書を職制（${currentUser?.name}）が確認し、人事・保健師へ回付しました。`;
                const newLog = { date: nowStr, text: logText, author: `${currentUser?.name} (${currentRoleLabel})`, role: currentRole };

                saveData({
                    shobyo_applications: updated,
                    contact_logs: [...(formData.contact_logs || []), newLog]
                });

                                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-100 mb-6"><CheckCircle className="w-10 h-10 text-green-600"/></div>
                                        <h2 className="text-2xl font-bold text-slate-800 mb-4">就業支援プログラム 完了</h2>
                                        <p className="text-slate-600 mb-8 max-w-lg mx-auto">通常業務への復帰が確認されました。今後のご活躍と、健康の維持をお祈りしております。体調に変化があった場合は、いつでも職制または健康支援センターへご相談ください。</p>
                                        
                                        {(canEdit('ohp') || canEdit('manager') || isAdmin) && (
                                            <div className="mt-8 pt-8 border-t border-slate-100 flex justify-center">
                                                <button onClick={() => { requestConfirm("フェーズを戻します。よろしいですか？", () => { saveData({ phase: 4 }); }); }} className="text-sm bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 px-6 rounded-md shadow-sm flex items-center justify-center gap-2 border border-red-200 transition-colors"><RotateCcw className="w-4 h-4"/> フォロー期間へ戻る</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                
                                {/* コンタクト履歴 */}
                                {currentRole !== 'employee' && (
                                    <div className="mt-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in-up">
                                        <div className="bg-slate-100 p-4 border-b border-slate-200">
                                            <h3 className="font-bold text-slate-700 flex items-center gap-2"><Briefcase className="w-5 h-5 text-slate-500"/> 関係者共有 コンタクト履歴・タイムライン</h3>
                                            <p className="text-xs text-slate-500 mt-1">※本人には表示されません。面談や電話連絡の履歴を記録してください。</p>
                                        </div>
                                        <div className="p-6">
                                            <div className="space-y-4 mb-6 max-h-60 overflow-y-auto pr-2">
                                                {formData.contact_logs && formData.contact_logs.length > 0 ? formData.contact_logs.map((log, idx) => (
                                                    <div key={idx} className="flex gap-4">
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 text-white font-bold ${log.role === 'ohp' ? 'bg-red-400' : log.role === 'manager' ? 'bg-emerald-500' : log.role === 'system' ? 'bg-purple-500' : 'bg-slate-400'}`}>
                                                            {log.role === 'ohp' ? '医' : log.role === 'manager' ? '職' : log.role === 'system' ? '機' : '管'}
                                                        </div>
                                                        <div className="bg-slate-50 border border-slate-100 p-3 rounded-lg flex-grow shadow-sm">
                                                            <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-700">{log.author}</span><span className="text-[10px] text-slate-400">{log.date}</span></div>
                                                            <p className="text-sm text-slate-800 whitespace-pre-wrap">{log.text}</p>
                                                        </div>
                                                    </div>
                                                )) : <div className="text-center text-slate-400 text-sm py-4">履歴はまだありません。</div>}
                                            </div>
                                            <div className="flex gap-3">
                                                <input type="text" name="new_log_text" value={formData.new_log_text || ''} onChange={handleInputChange} placeholder="連絡内容や面談結果を入力..." className="flex-grow p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" onKeyPress={(e) => { if(e.key === 'Enter') addContactLog(); }}/>
                                                <button onClick={addContactLog} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 rounded-lg transition-colors whitespace-nowrap">投稿</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}
                    </main>

                    {/* PDF出力用非表示レイアウト */}
                    <div className="print-only hidden print:block bg-white text-black p-8 text-sm">
                        <h1 className="text-2xl font-bold text-center border-b-2 border-black pb-4 mb-8">職場復帰支援プラン（判定・配慮事項 記録）</h1>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">1. 対象者情報</h2>
                            <table className="w-full border-collapse border border-black text-left">
                                <tbody>
                                    <tr><th className="border border-black p-2 bg-gray-100 w-1/4">氏名</th><td className="border border-black p-2">{formData.name || '未入力'}</td><th className="border border-black p-2 bg-gray-100 w-1/4">社員番号</th><td className="border border-black p-2">{formData.empId || '未入力'}</td></tr>
                                    <tr><th className="border border-black p-2 bg-gray-100">所属部署</th><td colSpan="3" className="border border-black p-2">{formData.department || '未入力'}</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">2. 就業判定結果（産業医・保健師）</h2>
                            <div className="p-4 border border-black min-h-[60px] font-bold text-lg">
                                {formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '① 通常就業可 (制限・配慮なし)' : 
                                 formData.doctor_final_judgment === 'restricted' ? '② 就業制限・配慮が必要 (条件付き就業可)' : 
                                 formData.doctor_final_judgment === 'impossible' ? '③ 就業不可 (療養継続)' : '未判定'}
                            </div>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">3. 就業上の配慮・条件（専門職指示）</h2>
                            <div className="p-4 border border-black min-h-[120px] whitespace-pre-wrap">
                                {formData.condition_text || (formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '特になし（通常就業のため制限事項なし）' : '未入力')}
                            </div>
                        </div>
                        <div className="mb-8">
                            <h2 className="text-lg font-bold mb-2">4. 職場（職制）での受け入れ確認</h2>
                            <table className="w-full border-collapse border border-black text-left">
                                <tbody>
                                    <tr>
                                        <th className="border border-black p-2 bg-gray-100 w-1/3">配慮の受け入れ可否</th>
                                        <td className="border border-black p-2">
                                            {formData.mgr_accept_short_time === 'yes' ? '受け入れ可能 (配慮事項に対応できる)' : 
                                             formData.mgr_accept_short_time === 'no' ? '受け入れ困難 (現場の体制的に厳しい)' : 
                                             formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '配慮不要（通常就業のため）' : '未確認'}
                                        </td>
                                    </tr>
                                    <tr><th className="border border-black p-2 bg-gray-100">職制が予定している配慮内容</th><td className="border border-black p-2 whitespace-pre-wrap">{formData.mgr_q0_4 || formData.mgr_q6_1 || (formData.doctor_final_judgment === 'normal' || (formData.phase >= 4 && !formData.doctor_final_judgment) ? '配慮不要' : '特になし')}</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-16 text-right"><p className="text-sm">出力日: {new Date().toLocaleDateString('ja-JP')}</p><p className="text-xs text-gray-500 mt-2">※本書類は要配慮個人情報を含みます。取り扱いには十分注意してください。</p></div>
                    </div>

                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<HealthSupportPortal/>);
    </script>
</body>
</html>
